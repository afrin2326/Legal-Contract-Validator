# ============ Server ============
server.port=8985
spring.application.name=legal-validator

# ============ Database ============
spring.datasource.url=${DB_URL}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ Schema init ============
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ============ File Upload ============
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============ Logging ============
logging.level.com.legalvalidator=DEBUG
logging.level.org.springframework.jdbc=INFO